<!DOCTYPE html>
<html>
<head>
  <title>Task Manager</title>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #fff;
      color: #000;
      transition: 0.3s;
    }

    body.dark {
      background-color: #1e1e1e;
      color: #f0f0f0;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .controls,
    .search-sort {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    input, select, button {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .task {
      border: 1px solid #ccc;
      border-left: 5px solid #000;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }

    .dark .task {
      background-color: #2a2a2a;
      border-color: #444;
    }

    .completed {
      text-decoration: line-through;
      color: #999;
    }

    .high {
      border-left-color: red;
    }

    .medium {
      border-left-color: orange;
    }

    .low {
      border-left-color: green;
    }

    .task button {
      margin-right: 8px;
    }

    .icon-large {
      font-size: 30px;
      margin-right: 10px;
    }

    .top-bar {
      text-align: center;
      margin-bottom: 10px;
      margin-top: 50px;
    }

    @media ((min-width: 250px) and (max-width: 550px)) or ((min-width: 700px) and (min-height: 1000px)) {
      .container {
        width: calc(100% - 40px);
        flex-direction: column;
      }
      .left {
        flex: none;
        margin-right: 0;
      }
      .right {
        display: flex;
        justify-content: center;
        width: 80%;
      }
      .logo, .tagline {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <i class="fa fa-tasks icon-large"></i>
    <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
  </div>

  <h2>Task Manager</h2>

  <div class="controls">
    <input type="text" id="name" placeholder="Task Name">
    <input type="text" id="description" placeholder="Description">
    <select id="priority">
      <option value="select">Select Priority</option>
      <option value="High">High</option>
      <option value="Medium"selected>Medium</option>
      <option value="Low">Low</option>
    </select>
    <input placeholder="Date" class="textbox-n" type="text" onfocus="(this.type='date')" onblur="(this.type='text')" id="dueDate" />
    <button onclick="addTask()">Add Task</button>
  </div>

  <div class="search-sort">
    <input type="text" id="search" placeholder="Search tasks..." oninput="filterTasks()">
    <button onclick="sortTasks()"><i class="fa fa-sort"></i> Sort by Priority</button>
    <button id="removeSortBtn" onclick="removeSort()" style="display:none;">
      <i class="fa fa-times"></i> Remove Sort
    </button>
  </div>

  <div id="taskList"></div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
    let originalTasks = [...tasks];
    let editingIndex = -1;

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function addTask() {
      const name = document.getElementById("name").value.trim();
      const description = document.getElementById("description").value.trim();
      const priority = document.getElementById("priority").value;
      const dueDate = document.getElementById("dueDate").value;

      if (!name) {
        alert("Task name is required.");
        return;
      }

      const task = { name, description, priority, dueDate, completed: false };

      if (editingIndex > -1) {
        tasks[editingIndex] = task;
        editingIndex = -1;
      } else {
        tasks.push(task);
      }

      originalTasks = [...tasks]; 
      saveTasks();
      displayTasks(tasks);
      clearForm();
    }

    function clearForm() {
      document.getElementById("name").value = "";
      document.getElementById("description").value = "";
      document.getElementById("priority").value = "select";
      document.getElementById("dueDate").value = "";
    }

    function displayTasks(taskArray) {
      const list = document.getElementById("taskList");
      list.innerHTML = "";

      taskArray.forEach((task, index) => {
        const div = document.createElement("div");
        let priorityClass = task.priority.toLowerCase();
        div.className = `task ${task.completed ? "completed" : ""} ${priorityClass}`;
        div.innerHTML = `
          <strong>${task.name}</strong> (${task.priority})<br>
          <em>${task.description}</em><br>
          <small>Due: ${task.dueDate}</small><br><br>
          <button onclick="toggleComplete(${index})">
            <i class="fa ${task.completed ? 'fa-undo' : 'fa-check'}"></i> ${task.completed ? 'Undo' : 'Complete'}
          </button>
          <button onclick="editTask(${index})"><i class="fa fa-edit"></i> Edit</button>
          <button onclick="deleteTask(${index})"><i class="fa fa-trash"></i> Delete</button>
        `;
        list.appendChild(div);
      });
    }

    function toggleComplete(index) {
      tasks[index].completed = !tasks[index].completed;
      saveTasks();
      displayTasks(tasks);
    }

    function deleteTask(index) {
      if (confirm("Are you sure you want to delete this task?")) {
        tasks.splice(index, 1);
        originalTasks = [...tasks];
        saveTasks();
        displayTasks(tasks);
      }
    }

    function editTask(index) {
      const task = tasks[index];
      document.getElementById("name").value = task.name;
      document.getElementById("description").value = task.description;
      document.getElementById("priority").value = task.priority;
      document.getElementById("dueDate").value = task.dueDate;
      editingIndex = index;
    }

    function filterTasks() {
      const search = document.getElementById("search").value.toLowerCase();
      const filtered = tasks.filter(task =>
        task.name.toLowerCase().includes(search) ||
        task.description.toLowerCase().includes(search)
      );
      displayTasks(filtered);
    }

    function sortTasks() {
      originalTasks = [...tasks];
      const priorityOrder = { High: 1, Medium: 2, Low: 3 };
      tasks.sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);
      displayTasks(tasks);
      document.getElementById("removeSortBtn").style.display = "inline-block";
    }

    function removeSort() {
      tasks = [...originalTasks]; 
      displayTasks(tasks);
      document.getElementById("removeSortBtn").style.display = "none";
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }

    displayTasks(tasks);
  </script>
</body>
</html>
