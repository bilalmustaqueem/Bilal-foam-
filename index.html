<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Signup Clone</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./index.css">
  <style>
   
  </style>
</head>
<body>
  <div class="left">
    <img src="./naseeb.png" style="width:700px;height:700px;"/>   
  </div>

  <div class="right">
    <div class="top-right">
      Already have an account? <a href="#">Sign in →</a>
    </div>
    <h2  class="test"> Sign up to GitHub</h2>

    <form>
      <label>Email</label>
      <input type="email" placeholder="Email" required>

      <label>Password</label>
      <input type="password" placeholder="Password" required>
      <p class="note">Password should be at least 15 characters OR at least 8 characters including a number and a lowercase letter.</p>

      <label>Username</label>
      <input type="text" placeholder="Username" required>
      <p class="note">Username may only contain alphanumeric characters or single hyphens, and cannot begin or end with a hyphen.</p>

      <label>Your Country/Region</label>
      <select>
        <option>Pakistan</option>
        <option>India</option>
        <option>United States</option>
        <option>Other</option>
      </select>

      <div class="checkbox">
        <input type="checkbox">
        <label>Receive occasional product updates and announcements</label>
      </div>


      <button type="submit">Continue →</button>
    </form>
  </div>
</body>
</html>
